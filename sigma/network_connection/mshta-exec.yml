title: mshta-exec
id: 6e0596ed-1111-2222-3333-211f238105b8
status: stable
description: Detects rare mshta child process
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.credential_access
