title: dsquery-domain-dump
id: 2634d3cf-1111-2222-3333-21665e381710
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.defense_evasion
