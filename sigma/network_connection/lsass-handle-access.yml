title: lsass-handle-access
id: 09a6eae4-1111-2222-3333-408a86fd1179
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
