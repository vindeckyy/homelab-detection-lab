title: samr-enumeration
id: 6962b617-1111-2222-3333-73b5e5f02d0c
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.execution
