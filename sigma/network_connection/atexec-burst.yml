title: atexec-burst
id: ba18b8de-1111-2222-3333-953f137037f1
status: stable
description: Detects rare mshta child process
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.persistence
