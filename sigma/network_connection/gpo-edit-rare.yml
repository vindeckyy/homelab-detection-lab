title: gpo-edit-rare
id: ca293c79-1111-2222-3333-92e53f3fa83a
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
