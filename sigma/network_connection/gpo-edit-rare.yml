title: gpo-edit-rare
id: 3c75d0e9-1111-2222-3333-aac1aa2f0511
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.discovery
