title: klist-purge-loop
id: f01e9a1a-1111-2222-3333-d04e4021ff60
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
