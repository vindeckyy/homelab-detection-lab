title: dcsync-activity
id: e6141090-1111-2222-3333-950e7f67a2d4
status: stable
description: Detects rare mshta child process
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.defense_evasion
