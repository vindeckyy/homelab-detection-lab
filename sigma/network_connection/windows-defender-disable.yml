title: windows-defender-disable
id: e11afbad-1111-2222-3333-ffed8f2a1fe0
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.lateral_movement
