title: regsvr32-http
id: 26951007-1111-2222-3333-bd4aa8f093e2
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
