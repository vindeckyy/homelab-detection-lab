title: regsvr32-http
id: e875c1b5-1111-2222-3333-2aa0b92e4ff4
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.discovery
