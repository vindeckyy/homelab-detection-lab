title: netexec-sweep
id: 562fbe38-1111-2222-3333-ec993034ebf9
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.lateral_movement
