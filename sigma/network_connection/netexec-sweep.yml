title: netexec-sweep
id: 26e670ad-1111-2222-3333-46d416582c86
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
