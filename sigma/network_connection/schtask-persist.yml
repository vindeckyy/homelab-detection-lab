title: schtask-persist
id: ee77d0c1-1111-2222-3333-227fbe2b844a
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.credential_access
