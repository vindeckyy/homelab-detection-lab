title: schtask-persist
id: 44069650-1111-2222-3333-435455d4f00e
status: stable
description: Detects rare mshta child process
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
