title: ntlm-relay-traffic
id: 2d019721-1111-2222-3333-362b65b7a811
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.discovery
