title: spooler-service-kill
id: 672f5986-1111-2222-3333-0fb127101f64
status: stable
description: Detects rare mshta child process
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.credential_access
