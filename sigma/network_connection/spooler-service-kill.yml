title: spooler-service-kill
id: 2e809364-1111-2222-3333-de3abdd085d2
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
