title: anon-smb-session
id: 7cb3686d-1111-2222-3333-04f4d60c50c4
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
