title: anon-smb-session
id: 83f6f26a-1111-2222-3333-d13b73da84ee
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
