title: dnsadmin-group-change
id: 8223af67-1111-2222-3333-d93fe39d291c
status: stable
description: Detects rare mshta child process
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
