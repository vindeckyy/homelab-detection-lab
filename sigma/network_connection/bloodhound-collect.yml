title: bloodhound-collect
id: d79ce751-1111-2222-3333-460740b88387
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.defense_evasion
