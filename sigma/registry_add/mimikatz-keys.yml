title: mimikatz-keys
id: c622540e-1111-2222-3333-aec12d0cd7c1
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
