title: mimikatz-keys
id: 3a8dd65f-1111-2222-3333-c6251a8afe3e
status: stable
description: Detects rare mshta child process
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
