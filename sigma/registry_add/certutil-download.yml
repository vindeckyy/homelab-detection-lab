title: certutil-download
id: b2191e30-1111-2222-3333-fc29a3c6ee0f
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.credential_access
