title: samr-enumeration
id: 73cfba19-1111-2222-3333-f40e1d5c7bb0
status: stable
description: Detects rare mshta child process
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
