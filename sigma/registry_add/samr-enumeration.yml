title: samr-enumeration
id: 73dd33fc-1111-2222-3333-d57ba514d5e8
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
