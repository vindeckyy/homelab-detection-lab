title: samr-enumeration
id: 609d4185-1111-2222-3333-97f7f8b5ae9b
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
