title: netexec-sweep
id: df0b5136-1111-2222-3333-94b798a83f97
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
