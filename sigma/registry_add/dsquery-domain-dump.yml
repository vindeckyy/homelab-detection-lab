title: dsquery-domain-dump
id: 3a35a538-1111-2222-3333-278f301e7073
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.credential_access
