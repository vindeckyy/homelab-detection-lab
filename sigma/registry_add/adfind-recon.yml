title: adfind-recon
id: da106cb8-1111-2222-3333-0d31101e3441
status: stable
description: Detects rare mshta child process
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
