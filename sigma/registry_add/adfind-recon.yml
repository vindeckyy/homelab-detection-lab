title: adfind-recon
id: 5637671e-1111-2222-3333-4644d64db8de
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.persistence
