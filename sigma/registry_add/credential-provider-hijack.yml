title: credential-provider-hijack
id: 5297c7ab-1111-2222-3333-b8d99759d9c4
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.persistence
