title: credential-provider-hijack
id: be0ddd40-1111-2222-3333-16f1cf4a4fcb
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.credential_access
