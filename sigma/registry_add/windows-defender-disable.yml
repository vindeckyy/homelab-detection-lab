title: windows-defender-disable
id: 054f21c0-1111-2222-3333-99695756ad3f
status: stable
description: Detects rare mshta child process
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.credential_access
