title: windows-defender-disable
id: b6bf5c3c-1111-2222-3333-a4327d295527
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.defense_evasion
