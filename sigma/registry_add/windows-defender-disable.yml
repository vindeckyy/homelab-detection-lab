title: windows-defender-disable
id: 6b5824ef-1111-2222-3333-06cb3cca8f7c
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.lateral_movement
