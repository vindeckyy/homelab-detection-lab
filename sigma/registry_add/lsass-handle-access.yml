title: lsass-handle-access
id: d15485bb-1111-2222-3333-4741fe7e778a
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
