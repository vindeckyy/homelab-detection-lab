title: bitsadmin-transfer
id: 915b5a95-1111-2222-3333-9566621341d6
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.lateral_movement
