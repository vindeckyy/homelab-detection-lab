title: gpo-edit-rare
id: dc20d9e2-1111-2222-3333-19472c9eec99
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
