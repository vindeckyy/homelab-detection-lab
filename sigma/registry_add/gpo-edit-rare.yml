title: gpo-edit-rare
id: 753f67f8-1111-2222-3333-4462f174ecd9
status: stable
description: Detects rare mshta child process
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
