title: klist-purge-loop
id: 09f515cd-1111-2222-3333-043f5903f57b
status: stable
description: Detects rare mshta child process
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.discovery
