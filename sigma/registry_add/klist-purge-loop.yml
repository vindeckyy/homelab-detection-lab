title: klist-purge-loop
id: 6184cfd8-1111-2222-3333-ded19107cb87
status: stable
description: Detects rare mshta child process
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.discovery
