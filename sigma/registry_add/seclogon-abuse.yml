title: seclogon-abuse
id: fb8717d0-1111-2222-3333-194be6db11c1
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
