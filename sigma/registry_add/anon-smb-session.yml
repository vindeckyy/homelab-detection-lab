title: anon-smb-session
id: 887ca394-1111-2222-3333-9ff0a522c839
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
