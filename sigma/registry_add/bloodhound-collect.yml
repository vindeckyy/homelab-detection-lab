title: bloodhound-collect
id: 75031c90-1111-2222-3333-8c2bc85d54c7
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.persistence
