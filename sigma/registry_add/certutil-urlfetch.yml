title: certutil-urlfetch
id: 91a8b24b-1111-2222-3333-bf25b3b4a56a
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
