title: certutil-urlfetch
id: 7fac36e0-1111-2222-3333-20715120f33d
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.defense_evasion
