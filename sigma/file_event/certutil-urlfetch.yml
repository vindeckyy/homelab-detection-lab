title: certutil-urlfetch
id: 87ba4172-1111-2222-3333-ba038015ddba
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.defense_evasion
