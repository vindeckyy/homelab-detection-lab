title: encoded-powershell
id: c5f6b291-1111-2222-3333-a605ae3541e5
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
