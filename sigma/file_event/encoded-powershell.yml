title: encoded-powershell
id: 54bb6cfa-1111-2222-3333-b9d8f6dc1325
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
