title: encoded-powershell
id: 44709a36-1111-2222-3333-8fa052c9c571
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.execution
