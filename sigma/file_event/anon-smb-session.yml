title: anon-smb-session
id: 2c036597-1111-2222-3333-e47a1e5b162f
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.execution
