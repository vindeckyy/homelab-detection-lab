title: anon-smb-session
id: d3f2c68c-1111-2222-3333-01431d4fde11
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.credential_access
