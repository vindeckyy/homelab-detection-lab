title: anon-smb-session
id: 635d4b05-1111-2222-3333-e6417020f44c
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.execution
