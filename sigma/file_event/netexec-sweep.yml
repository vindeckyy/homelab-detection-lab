title: netexec-sweep
id: cdeb2fe4-1111-2222-3333-19b2d7e8fd8f
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.persistence
