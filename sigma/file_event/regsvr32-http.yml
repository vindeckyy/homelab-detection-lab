title: regsvr32-http
id: f949af16-1111-2222-3333-c98b22969a54
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.execution
