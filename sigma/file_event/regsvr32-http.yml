title: regsvr32-http
id: 4f522db5-1111-2222-3333-26d93b3ef243
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
