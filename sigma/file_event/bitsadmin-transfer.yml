title: bitsadmin-transfer
id: eae3cf2b-1111-2222-3333-458fe8bfe43c
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.persistence
