title: atexec-burst
id: 781064e7-1111-2222-3333-2ae2bde05c11
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
