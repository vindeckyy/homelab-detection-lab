title: atexec-burst
id: 77e4f13c-1111-2222-3333-ce46c9cef76e
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.persistence
