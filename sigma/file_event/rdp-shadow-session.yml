title: rdp-shadow-session
id: d4a60797-1111-2222-3333-fb5abfd2e6d0
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.persistence
