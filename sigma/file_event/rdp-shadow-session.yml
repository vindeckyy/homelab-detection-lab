title: rdp-shadow-session
id: e4e73193-1111-2222-3333-9e988dfe5ea3
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.execution
