title: lsass-handle-access
id: b3c21e38-1111-2222-3333-34ffd9b21960
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.execution
