title: lsass-handle-access
id: afa2c0f8-1111-2222-3333-7d6bb7cab71a
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.credential_access
