title: mshta-exec
id: 0a37c4c8-1111-2222-3333-b0de1e2a6769
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.credential_access
