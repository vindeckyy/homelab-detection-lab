title: certutil-download
id: 1cdfc219-1111-2222-3333-45e57e497f3e
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.credential_access
