title: certutil-download
id: b64bc928-1111-2222-3333-9a2fb40bc8d9
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.lateral_movement
