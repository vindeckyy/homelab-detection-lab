title: certutil-download
id: 2f526ab7-1111-2222-3333-9d5d2284463b
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.execution
