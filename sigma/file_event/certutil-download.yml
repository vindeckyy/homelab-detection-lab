title: certutil-download
id: d81cd1ba-1111-2222-3333-f5d70c64d95f
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
