title: dcsync-activity
id: 2fb93683-1111-2222-3333-1776ca0fe53d
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.defense_evasion
