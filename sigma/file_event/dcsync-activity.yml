title: dcsync-activity
id: 02a718e8-1111-2222-3333-fcb999575bfc
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.lateral_movement
