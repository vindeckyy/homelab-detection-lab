title: dnsadmin-group-change
id: 024c039a-1111-2222-3333-83e9fb5a509f
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.credential_access
