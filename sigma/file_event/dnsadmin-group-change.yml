title: dnsadmin-group-change
id: 2057bd3c-1111-2222-3333-5e6c432da94d
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.persistence
