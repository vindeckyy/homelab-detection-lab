title: dnsadmin-group-change
id: 5b29d07a-1111-2222-3333-b64844cc3be2
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.credential_access
