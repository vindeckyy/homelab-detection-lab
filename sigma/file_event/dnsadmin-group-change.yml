title: dnsadmin-group-change
id: 718abf7c-1111-2222-3333-c4e1a17206be
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.persistence
