title: dnsadmin-group-change
id: 99e4a60c-1111-2222-3333-43f4fee9c3c8
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.discovery
