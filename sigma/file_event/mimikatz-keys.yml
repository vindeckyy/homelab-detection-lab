title: mimikatz-keys
id: 7c37532f-1111-2222-3333-c2c0a8fcf3f8
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.defense_evasion
