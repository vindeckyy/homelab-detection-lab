title: mimikatz-keys
id: ce2de73c-1111-2222-3333-5f73c8db3d0c
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.persistence
