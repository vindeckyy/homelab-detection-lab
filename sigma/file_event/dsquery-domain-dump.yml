title: dsquery-domain-dump
id: daba7ec1-1111-2222-3333-98733a62119d
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.defense_evasion
