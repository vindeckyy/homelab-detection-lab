title: spooler-service-kill
id: 3757f483-1111-2222-3333-bf67be3d8fa0
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.discovery
