title: spooler-service-kill
id: cc2e2c0f-1111-2222-3333-329d90aa80d7
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.credential_access
