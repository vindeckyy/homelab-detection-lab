title: klist-purge-loop
id: 302d1073-1111-2222-3333-15a682b243e5
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.defense_evasion
