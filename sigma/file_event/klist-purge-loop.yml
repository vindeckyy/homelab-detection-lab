title: klist-purge-loop
id: d1857c98-1111-2222-3333-ffc5ada95c94
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.discovery
