title: klist-purge-loop
id: 0c98dec3-1111-2222-3333-951963355524
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.discovery
