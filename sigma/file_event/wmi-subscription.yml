title: wmi-subscription
id: 90a1f7ce-1111-2222-3333-6e7d23e4a07a
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.discovery
