title: kerberoast-activity
id: 70ebd657-1111-2222-3333-9edc9770aecc
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.discovery
