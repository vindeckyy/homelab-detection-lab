title: bloodhound-collect
id: 31f726c6-1111-2222-3333-fdd7b93b89c5
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.discovery
