title: bloodhound-collect
id: b0dca3f1-1111-2222-3333-5df7b08fbd16
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.lateral_movement
