title: bloodhound-collect
id: 6ffd7e24-1111-2222-3333-1d7f8015a331
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.execution
