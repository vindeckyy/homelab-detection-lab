title: adfind-recon
id: e1cb1566-1111-2222-3333-456f20fc3683
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.defense_evasion
