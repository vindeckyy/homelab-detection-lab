title: adfind-recon
id: 182a0754-1111-2222-3333-fb69d36a012a
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.discovery
