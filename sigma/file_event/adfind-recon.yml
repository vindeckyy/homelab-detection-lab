title: adfind-recon
id: 979395d0-1111-2222-3333-1bad763ab225
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
