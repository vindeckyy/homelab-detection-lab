title: windows-defender-disable
id: 796b38ad-1111-2222-3333-29a8c1833a14
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.defense_evasion
