title: new-admin-member
id: a7e01204-1111-2222-3333-21443885b5e4
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.defense_evasion
