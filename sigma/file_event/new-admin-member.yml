title: new-admin-member
id: b3cb0d51-1111-2222-3333-fb39df0f9023
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.discovery
