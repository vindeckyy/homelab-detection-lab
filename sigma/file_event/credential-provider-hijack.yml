title: credential-provider-hijack
id: 6482ea7e-1111-2222-3333-81659f4394d0
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.discovery
