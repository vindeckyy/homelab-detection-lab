title: credential-provider-hijack
id: ca400ed4-1111-2222-3333-e695d2ed7af5
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.persistence
