title: credential-provider-hijack
id: 431aa3c3-1111-2222-3333-df9463222796
status: stable
description: Detects rare mshta child process
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.discovery
