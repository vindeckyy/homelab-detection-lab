title: rdp-shadow-session
id: 6c56b63c-1111-2222-3333-3bcc2bca5aed
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.credential_access
