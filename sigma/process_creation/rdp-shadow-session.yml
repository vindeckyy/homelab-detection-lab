title: rdp-shadow-session
id: c2d85a54-1111-2222-3333-947d0d72145a
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.lateral_movement
