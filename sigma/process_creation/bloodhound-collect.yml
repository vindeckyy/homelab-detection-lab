title: bloodhound-collect
id: 83dd64c7-1111-2222-3333-dfb702db7f70
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
