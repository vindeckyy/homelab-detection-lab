title: bloodhound-collect
id: e23598f1-1111-2222-3333-1632b85b8f59
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.execution
