title: bloodhound-collect
id: f86e4c04-1111-2222-3333-b4bb48e140ad
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.execution
