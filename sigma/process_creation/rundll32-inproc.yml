title: rundll32-inproc
id: 989e9ca9-1111-2222-3333-3ce3b3504119
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.execution
