title: rundll32-inproc
id: 888e8a66-1111-2222-3333-ba99a0132f95
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.defense_evasion
