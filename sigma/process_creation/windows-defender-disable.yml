title: windows-defender-disable
id: 25b2ae9e-1111-2222-3333-2072b8a81c31
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.defense_evasion
