title: windows-defender-disable
id: 9dfb4fef-1111-2222-3333-58a18aaf8b2f
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.defense_evasion
