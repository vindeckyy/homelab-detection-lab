title: windows-defender-disable
id: 84d73c11-1111-2222-3333-07c86c43db73
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.execution
