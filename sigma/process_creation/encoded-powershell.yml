title: encoded-powershell
id: a6a07947-1111-2222-3333-3a120f5b4059
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.defense_evasion
