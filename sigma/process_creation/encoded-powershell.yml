title: encoded-powershell
id: fdd9d34f-1111-2222-3333-33d500b167db
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.credential_access
