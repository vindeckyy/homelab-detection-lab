title: mimikatz-keys
id: 874ab66a-1111-2222-3333-3b0f656544f2
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
