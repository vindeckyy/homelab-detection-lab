title: klist-purge-loop
id: 73739eb7-1111-2222-3333-86e884b2ffd7
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.defense_evasion
