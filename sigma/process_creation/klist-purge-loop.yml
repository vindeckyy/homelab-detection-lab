title: klist-purge-loop
id: 4d9f73cf-1111-2222-3333-81b23b317abf
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
