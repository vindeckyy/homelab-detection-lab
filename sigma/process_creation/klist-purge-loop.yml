title: klist-purge-loop
id: b84959be-1111-2222-3333-3bfd97359ab9
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.persistence
