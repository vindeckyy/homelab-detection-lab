title: bitsadmin-transfer
id: 77320889-1111-2222-3333-9e24201a9aff
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.credential_access
