title: bitsadmin-transfer
id: 428516e4-1111-2222-3333-dfaba324eee2
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
