title: seclogon-abuse
id: 5af750c2-1111-2222-3333-464bf4f5a5c5
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.lateral_movement
