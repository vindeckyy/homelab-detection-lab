title: adfind-recon
id: 4fd4fb92-1111-2222-3333-82b0e174fc6b
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\svchost'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.credential_access
