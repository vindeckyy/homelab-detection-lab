title: adfind-recon
id: 452aceca-1111-2222-3333-b6568433f7e2
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\wscript'
        CommandLine|contains: '/install'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.collection/T1560
    - attack.discovery
