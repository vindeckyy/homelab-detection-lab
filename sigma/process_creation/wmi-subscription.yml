title: wmi-subscription
id: 7a3b2a56-1111-2222-3333-1cb83f4c9920
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.discovery
