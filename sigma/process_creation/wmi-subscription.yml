title: wmi-subscription
id: 6e21c965-1111-2222-3333-9bc8d663172d
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.execution
