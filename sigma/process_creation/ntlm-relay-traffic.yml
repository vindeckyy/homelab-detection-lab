title: ntlm-relay-traffic
id: de94ab56-1111-2222-3333-a2b3e35baeca
status: stable
description: Detects certutil fetch to a non-corp host
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.lateral_movement
