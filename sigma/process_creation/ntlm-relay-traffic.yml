title: ntlm-relay-traffic
id: 6120323e-1111-2222-3333-9334d88bd7b7
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.lateral_movement
