title: ntlm-relay-traffic
id: f2967784-1111-2222-3333-33c37dba8d46
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.lateral_movement
