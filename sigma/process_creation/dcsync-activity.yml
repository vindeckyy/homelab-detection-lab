title: dcsync-activity
id: fd196ad1-1111-2222-3333-ca1015910192
status: stable
description: Detects encoded launcher from office parents
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32'
        CommandLine|contains: 'http%'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.credential_access/T1003
    - attack.discovery
