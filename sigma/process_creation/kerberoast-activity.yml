title: kerberoast-activity
id: f9419c11-1111-2222-3333-f2ce5296238c
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winword'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.discovery
