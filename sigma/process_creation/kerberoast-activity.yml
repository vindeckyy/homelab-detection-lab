title: kerberoast-activity
id: 60114b7e-1111-2222-3333-32e4678869a4
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mshta'
        CommandLine|contains: 'download'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.defense_evasion/T1218
    - attack.lateral_movement
