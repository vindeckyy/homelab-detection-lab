title: kerberoast-activity
id: ce949b9c-1111-2222-3333-3aa89b2f907e
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell'
        CommandLine|contains: '-enc'
    filter:
        ParentImage|endswith: '\explorer'
    condition: selection and not filter
tags:
    - attack.execution/T1059
    - attack.execution
