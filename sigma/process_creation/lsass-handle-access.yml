title: lsass-handle-access
id: d2a062b6-1111-2222-3333-7ebb3c5c9995
status: stable
description: Detects schtask created outside it ops hours
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
