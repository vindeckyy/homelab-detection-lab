title: lsass-handle-access
id: 369ba4e3-1111-2222-3333-6b9dda42e7aa
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.defense_evasion
