title: credential-provider-hijack
id: e9e6731c-1111-2222-3333-ca518ad599d9
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd'
        CommandLine|contains: '-nop -w hidden'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.persistence/T1053
    - attack.persistence
