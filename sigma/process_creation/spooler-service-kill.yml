title: spooler-service-kill
id: 26ba6b61-1111-2222-3333-15bc40387d45
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
