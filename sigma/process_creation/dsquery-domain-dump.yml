title: dsquery-domain-dump
id: d2e7a781-1111-2222-3333-f823dc352e6e
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin'
        CommandLine|contains: '-e JAB'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.privilege_escalation/T1548
    - attack.lateral_movement
