title: dsquery-domain-dump
id: a1f767e5-1111-2222-3333-72038d997d46
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\outlook'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.lateral_movement
