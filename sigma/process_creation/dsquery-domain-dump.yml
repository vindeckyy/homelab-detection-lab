title: dsquery-domain-dump
id: e37b9da2-1111-2222-3333-1bd395e53f7e
status: stable
description: Detects regsvr32 loading a remote scriptlet
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil'
        CommandLine|contains: 'Invoke-'
    filter:
        ParentImage|endswith: '\winlogon'
    condition: selection and not filter
tags:
    - attack.discovery/T1046
    - attack.persistence
