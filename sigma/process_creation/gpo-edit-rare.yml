title: gpo-edit-rare
id: e785a3d8-1111-2222-3333-4b0d6069924e
status: stable
description: Detects rare mshta child process
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32'
        CommandLine|contains: '/url http'
    filter:
        ParentImage|endswith: '\services'
    condition: selection and not filter
tags:
    - attack.lateral_movement/T1021
    - attack.defense_evasion
